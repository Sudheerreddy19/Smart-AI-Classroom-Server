spring:
  application:
    name: Smart AI Classroom

  datasource:
    # Supports: Neon / Render (DATABASE_URL) and Railway (PGHOST/PGPORT/PGDATABASE)
    url: ${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ai_smart_classroom}}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:23FE1A0424}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: SmartClassroomPool
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      data-source-properties:
        sslmode: require

  jpa:
    open-in-view: true
    show-sql: false
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jackson:
    serialization:
      write-dates-as-timestamps: false

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2:3b}
          temperature: 0.7

face:
  service:
    url: ${FACE_SERVICE_URL:http://localhost:8000}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.ai: DEBUG
    dev.langchain4j: DEBUG
    com.finalYear: DEBUG


springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: SmartClassroomHub2025SecretKeyForJWTMin32CharactersLong!!
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - https://*.up.railway.app
      - https://*.railway.app
      - https://*.onrender.com
      - https://*.vercel.app
      - https://*.netlify.app

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: smart-classroom