spring:
  application:
    name: Smart AI Classroom

  datasource:
    # Supports: Neon / Render (DATABASE_URL) and Railway (PGHOST/PGPORT/PGDATABASE)
    url: ${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ai_smart_classroom}}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}

    hikari:
      pool-name: SmartClassroomPool
      # Neon free tier: max 100 connections — keep pool small
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      # Neon requires SSL
      data-source-properties:
        sslmode: require

  jpa:
    show-sql: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2:3b}

server:
  port: ${PORT:8080}

  error:
    include-message: never
    include-binding-errors: never

logging:
  level:
    com.finalYear: INFO
    org.springframework: WARN
    org.springframework.security: WARN
    org.hibernate: WARN

app:
  jwt:
    # Render: set JWT_SECRET as environment variable, fallback to default secret if missing
    secret: ${JWT_SECRET:SmartClassroomHub2025SecretKeyForJWTMin32CharactersLong!!}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

  cors:
    allowed-origins:
      - ${CORS_ORIGINS:*}

face:
  service:
    url: ${FACE_SERVICE_URL:http://localhost:8000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:smart-classroom}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false